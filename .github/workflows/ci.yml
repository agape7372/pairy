name: CI

# 배포는 Vercel Git 연동이 담당한다(main push → 프로덕션, PR → 프리뷰).
# 이 워크플로는 품질 게이트만 수행 — GitHub Pages 배포(구 deploy.yml)는 DL-0001 로 폐기.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 변경 파일 lint 게이트가 base 와의 diff 를 계산하는 데 필요

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # TOP50 #9: 프로덕션 빌드가 깨지는 커밋이 main 에 닿지 않도록 차단.
      # CI 에는 Supabase env 가 없으므로 의도된 데모 빌드 플래그를 사용한다(next.config 가드 준수).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ALLOW_DEMO_BUILD: "1"

      # 미배선(만들고 안 이음) 파일 차단 게이트 — 베이스라인은 knip.jsonc, 신규 유입만 실패.
      # (사례: useTemplates 가 소비자 0 인 채로 남아 업로드 틀이 어디에도 안 보이던 버그)
      - name: Unwired files check (knip)
        run: npx knip --include files

      # 변경 파일만 lint 차단 게이트 — 신규 부채 유입 방지 (기존 부채는 아래 비차단 잡에서 추적).
      - name: Lint changed files (blocking, PR only)
        if: github.event_name == 'pull_request'
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | tr '\n' ' ' | xargs npx eslint
          else
            echo "no TS/TSX changes"
          fi

      # lint 는 기존 부채(1,880 errors / 19,973 warnings, 2026-07-06 측정)가 커서 당분간 비차단.
      # 부채 소각(TOP50 lint-debt burndown) 완료 후 continue-on-error 를 제거해 차단 게이트로 승격할 것.
      - name: Lint (non-blocking, debt tracked)
        run: npm run lint
        continue-on-error: true

  # E2E 스모크 — "클릭 무반응"·"죽은 링크" 부류 회귀를 실브라우저로 차단 (2026-07-19).
  # 데모 모드(dev 서버, Supabase env 불필요)로 결정적으로 동작한다.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Smoke tests
        run: npx playwright test e2e/smoke.spec.ts --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
