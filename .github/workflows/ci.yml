name: CI

# 배포는 Vercel Git 연동이 담당한다(main push → 프로덕션, PR → 프리뷰).
# 이 워크플로는 품질 게이트만 수행 — GitHub Pages 배포(구 deploy.yml)는 DL-0001 로 폐기.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # M-02(2차 감사 · DL-0006): 빌드 회귀 차단 게이트. CI 엔 secrets 가 없으므로
      # 데모 빌드로 허용(NEXT_PUBLIC_ALLOW_DEMO_BUILD=1) — next.config.ts 의 프로덕션 env 가드 통과용.
      # 실 배포 env 검증은 Vercel 빌드가 담당(프로덕션 키 주입 상태에서 가드 작동).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ALLOW_DEMO_BUILD: "1"

      # lint 는 기존 부채(1,880 errors / 19,973 warnings, 2026-07-06 측정)가 커서 당분간 비차단.
      # 부채 소각(TOP50 lint-debt burndown) 완료 후 continue-on-error 를 제거해 차단 게이트로 승격할 것.
      - name: Lint (non-blocking, debt tracked)
        run: npm run lint
        continue-on-error: true
